<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chatbot-api">
  <!-- Transparent canvas — orange (#F97316) + white mark only; no background rect -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chat bubble outline (open on the right for the plug) -->
