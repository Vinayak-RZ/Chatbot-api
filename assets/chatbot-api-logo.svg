      d="M150 168
         c0-32 26-58 58-58
         h120
         c32 0 58 26 58 58
         v20
         M386 284
         v20
         c0 32-26 58-58 58
         H246
         l-34 30
         v-30
         c-32 0-58-26-58-58
         V168"
      stroke="#F97316"
      stroke-width="32"
    />

    <!-- Left code bracket < (white) -->
    <path d="M218 200 L178 240 L218 280" stroke="#FFFFFF" stroke-width="26"/>

    <!-- Colon bars (orange) -->
    <rect x="244" y="220" width="32" height="14" rx="7" fill="#F97316" stroke="none"/>
    <rect x="244" y="246" width="32" height="14" rx="7" fill="#F97316" stroke="none"/>

    <!-- Combined > bracket + plug (white) -->
    <path d="M300 200 L340 240 L300 280" stroke="#FFFFFF" stroke-width="26"/>
    <path
      d="M340 240
         h20
         M360 214
         v52
         M360 214
         h48
         M360 266
         h48"
      stroke="#FFFFFF"
      stroke-width="24"
    />
    <circle cx="416" cy="214" r="12" fill="#FFFFFF" stroke="none"/>
    <circle cx="416" cy="266" r="12" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
