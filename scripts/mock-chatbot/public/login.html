<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock Chat Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: grid; place-items: center; }
    .login {
      width: min(360px, 92vw);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--sidebar);
    }
    .login h1 { margin: 0 0 4px; font-size: 1.35rem; }
    .login p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .login label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
    .login input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--composer-border);
      background: var(--composer-bg);
      color: var(--text);
    }
    .login button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #0d0d0d;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form class="login" method="post" action="/auth/login">
    <h1>Mock Chat</h1>
    <p>Sign in to continue</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="mock@example.com" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required value="mock-password" />
    <button type="submit">Continue</button>
  </form>
</body>
</html>
