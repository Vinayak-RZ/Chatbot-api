<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="stage-slideover-sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand-row">
          <span class="sidebar-brand">Mock Chat</span>
          <div class="sidebar-icon-btns">
            <button type="button" class="icon-btn" aria-label="Search" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            </button>
            <button type="button" class="icon-btn" aria-label="Collapse sidebar" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </button>
          </div>
        </div>

        <a href="/" data-testid="create-new-chat-button" class="nav-item new-chat active" id="new-chat-rail" aria-label="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>New chat</span>
        </a>

        <nav class="sidebar-nav" aria-label="Primary">
          <a href="#" class="nav-item" tabindex="-1"><span class="nav-ico">☰</span> Library</a>
          <a href="#" class="nav-item" tabindex="-1"><span class="nav-ico">◷</span> Scheduled</a>
          <a href="#" class="nav-item" tabindex="-1"><span class="nav-ico">＠</span> Plugins</a>
          <a href="#" class="nav-item" tabindex="-1"><span class="nav-ico">◈</span> Codex</a>
          <a href="#" class="nav-item" tabindex="-1"><span class="nav-ico">···</span> More</a>
        </nav>
      </div>

      <nav aria-label="Chat history" class="sidebar-scroll">
        <div class="section-label">Pinned</div>
        <div id="history" class="history">
          <a href="/c/mock-1" class="history-item">Chat 1</a>
          <a href="/c/mock-2" class="history-item">Chat 2</a>
          <a href="/c/mock-3" class="history-item">Sample project</a>
          <a href="/c/mock-4" class="history-item">Notes</a>
        </div>
        <div class="section-label">Projects</div>
        <div class="history">
          <a href="/c/mock-p1" class="history-item">Project Alpha</a>
          <a href="/c/mock-p2" class="history-item">Project Beta</a>
        </div>
      </nav>

      <div class="user-chip">
        <span class="avatar" aria-hidden="true">MU</span>
        <span class="user-meta">
          <span class="user-name">Mock User</span>
          <span class="user-badge">Go</span>
        </span>
      </div>
    </aside>

    <main id="main" role="main">
      <header class="topbar">
        <div class="mode-toggle" role="tablist" aria-label="Mode">
          <button type="button" class="mode-pill active" role="tab" aria-selected="true">Chat</button>
          <button type="button" class="mode-pill" role="tab" aria-selected="false" tabindex="-1">+ Work</button>
        </div>
        <a href="/" data-testid="create-new-chat-button" class="new-chat-inline icon-btn" aria-label="New chat" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </a>
      </header>

      <div class="main-stage is-empty">
        <div id="empty-hero" class="empty-hero">
          <h1 class="hero-title">Where should we begin?</h1>
        </div>

        <div id="thread" data-testid="conversation-panel" class="thread" hidden></div>

        <form data-type="unified-composer" id="composer-form" class="composer">
          <button type="button" data-testid="composer-plus-btn" class="plus" aria-label="Add">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="composer-body">
            <div
              id="prompt-textarea"
              class="ProseMirror"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              data-placeholder="Ask anything"
            ></div>
            <textarea name="prompt-textarea" class="hidden-mirror" tabindex="-1" aria-hidden="true"></textarea>
          </div>
          <div class="composer-actions">
            <button type="button" class="think-btn" tabindex="-1" aria-label="Think">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              Think
            </button>
            <button type="button" class="mic-btn" tabindex="-1" aria-label="Dictate">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
            </button>
            <button type="button" id="voice-button" class="voice" aria-label="Voice">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="4" y="9" width="2.5" height="6" rx="1"/>
                <rect x="8.5" y="6" width="2.5" height="12" rx="1"/>
                <rect x="13" y="8" width="2.5" height="8" rx="1"/>
                <rect x="17.5" y="5" width="2.5" height="14" rx="1"/>
              </svg>
            </button>
            <button type="submit" data-testid="send-button" class="send" aria-label="Send" hidden disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button type="button" data-testid="stop-button" class="stop" aria-label="Stop" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
