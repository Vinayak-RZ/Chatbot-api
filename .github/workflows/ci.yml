name: ci

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start mock
        run: |
          Start-Process -NoNewWindow npm -ArgumentList "run","mock"
          Start-Sleep -Seconds 2
      - run: npm run typecheck
      - run: npm test
        env:
          MOCK_URL: http://127.0.0.1:4173
