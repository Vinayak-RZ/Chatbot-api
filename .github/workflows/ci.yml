name: ci

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Start mock
        shell: pwsh
        run: |
          $npm = (Get-Command npm.cmd).Source
          Start-Process -FilePath $npm -ArgumentList @('run','mock') -WorkingDirectory $pwd -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $up) { throw 'Mock did not become ready on :4173' }
          Write-Host 'Mock is up'
      - run: npm run typecheck
      - run: npm test
        env:
          MOCK_URL: http://127.0.0.1:4173
